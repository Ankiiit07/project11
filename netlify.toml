[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve static assets first (no redirect)
[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Serve sitemap with correct content type
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  headers = {Content-Type = "application/xml"}

# Handle client-side routing for everything else
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Functions run on this version too; the MongoDB driver needs Node 20.19+.
  NODE_VERSION = "20"
  # Firebase web config is public by design (it ships in every Firebase site's
  # JavaScript), so don't treat these values as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID"
